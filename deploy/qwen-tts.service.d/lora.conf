[Service]
# adapter 代码与训练产物保留，但生产默认不开。
# 依据（2026-10-09 同音色同文案多种子对照，见 docs/两阶段还原实验与最佳方案-2026-10-09.md 2.11）：
#   seed 42   base 96.60%  vs adapter 96.14%
#   seed 2026 base 95.65%  vs adapter 95.67%
#   平均差 ~0.22 分 < seed 自身波动 0.47~0.95 分 → 差异不显著。
# 没有证据显示 adapter 带来提升，就不拿它当提升上线（与"不能把 loss 下降当
# 效果提升"是同一条原则）。离线无约束环境下 base 会不停嘴、adapter 正常，
# 但生产链路有分块 + 语速锁定 + 异常段重试，这条差异被抹平了。
#
# 需要开启时：
#   1. TTS_LORA_ADAPTERS=<音色前缀>=<ckpt 路径>[,<前缀>=<路径>]
#   2. TTS_LORA_ALIAS 把员工默认音色映射到对应前缀 —— 这一步极易漏：
#      server.py 的 BEST_CLONE = {"male":"EL_male","female":"EL_female"}，
#      员工点男/女实际用的是 EL_*，而 adapter 前缀是 yohan_male/SOLA_female，
#      不映射就永远匹配不上、静默回落 base。
#      已用 campplus 嵌入核验同人（阈值 0.75）：
#        EL_male / yo han / yohan_male  0.88~0.92
#        EL_female / SOLA_female        0.911
#        elara                          0.25~0.34（另一人，不要映射）
#   3. 改完必须 systemctl daemon-reload && systemctl restart qwen-tts
Environment="TTS_LORA_ADAPTERS="
Environment="TTS_LORA_ALIAS="
Environment="TTS_KO_NUM=1"
