[Service]
# r27 韵律增强（2026-10-10）
#
# 依据：tools/prosody_target.py 同文案(799e4d)对比发现两项量化差距
#   句尾降调幅度  案例 -7.62 st  vs  生成 -5.02 st   （差 2.6 半音）
#   句内音高动态  案例 12.81 st  vs  生成 10.15 st   （差 2.7 半音）
#   附带：不该上扬处上扬 rise 5%(案例) -> 10%(生成)
# 这就是人工盲听"语调不对 / 像念稿"的量化形态。
#
# 【句尾定向下降】TTS_PROSO_TAIL_DROP
#   在句尾窗口内额外压低 N 个半音（加性，不是乘性）。
#   与既有 k_tail 的区别：k_tail 绕句中位缩放，会**同时放大**不该上扬的
#   升调句；drop 是定向的 —— 降调句降得更彻底，升调句的上扬被抵消。
# 🔴 实测结论：设为 0（关闭）。理由见下方"分离验证"。
#   它确实把句尾降调幅度从 -5.02 拉到 -7.10（案例 -7.62，达标），
#   但 fidelity 总分反而降了，且两个 seed 同向。改善单项 ≠ 改善听感。
#   单样本曾判"有效"，多种子后翻车 —— 与 2026-10-09 adapter 那次是同一类教训。
#   要重新做，得先解决它和 E(句尾多样性) 的冲突：降得更狠 → 句尾更统一
#   → 多样性下降，二者可能此消彼长。
Environment="TTS_PROSO_TAIL_DROP=0"
Environment="TTS_PROSO_TAIL_DROP_MAX=4.0"
#
# 【呼吸合成】案例原声不含呼吸（ElevenLabs TTS 本就不合成；已诊断静音段
#   rel_db 单峰连续、无双峰），所以这项无法从案例克隆，只能主动合成 ——
#   用户拍板走 C 方案。位置仍沿用案例的停顿结构，只在够长的停顿里加气流声。
#   依据 INTERSPEECH2024(arXiv:2402.00288)：带呼吸 TTS 的 MOS 3.55 > 不带 3.34。
#   TTS_BREATH_SYN=0 一键关闭。
#
#   分离验证（同文案 799e4d / EL_male / 两 seed，fidelity 总分）：
#     base(都关)        96.60 / 95.65   均值 96.13
#     只开呼吸          96.05            （−0.55，落在 seed 波动 0.95 内）
#     呼吸+句尾下降     95.85 / 94.52   均值 95.19（−0.94，两 seed 同向）
#   → 呼吸影响可忽略，保留；句尾下降有额外负贡献，关闭。
#   最终线上配置 = 呼吸开 + 句尾下降关。
Environment="TTS_BREATH_SYN=1"
Environment="TTS_BREATH_PER_MIN=10.0"
Environment="TTS_BREATH_GAIN_DB=-25.0"
Environment="TTS_BREATH_MIN_GAP_MS=380"
