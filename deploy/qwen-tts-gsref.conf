# 第50轮：GS 参考音频替换表（qwen-tts drop-in）
#
# 背景：GS 只接受 **3~10 秒**的参考音频，超长直接 HTTP 500。
#   而员工默认音色 BEST_CLONE = EL_female(15.08s) / EL_male(14.98s) 都是 15 秒
#   -> 只要把默认引擎切成 gptsovits，员工每一次提交都会 500。实测：
#        ref=EL_female.wav(15.08s)           -> HTTP 500
#        ref=prompt_sola_00b6a45a.wav(10.0s) -> HTTP 200
#
# 这里把 BEST_CLONE 映射到**同人**的 GS 专用音色。这两个就是 z20 里 GS 素材
# 实际用的音色（见 /mnt/tts/data/jobs.json）：
#     gs48f_eq   -> SOLA_gs10   (10.00s)
#     gs48m_post2-> yohan_gs_f8 (6.20s)
# 值是音色名而不是路径，path + ref_text 都取自 voices.json，保证与实验素材逐字一致
# （换音频不换 ref_text = 语速崩 + 把参考文本当正文念，CER 0.66 事故）。
#
# 🔴 不设这个变量 = 行为与打补丁前完全一致，不影响任何非 GS 引擎。
[Service]
Environment="TTS_GS_REF_MAP=EL_female=SOLA_gs10,EL_male=yohan_gs_f8"
