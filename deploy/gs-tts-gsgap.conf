# 第51轮：GS 段间强制静音 → 0（修「机器感」的停顿结构）
#
# 依据（pauseforensics 实测，见 tools/pauseforensics.py）：
#   GS 服务在每段之间插 0.30s 纯数字零静音（deploy/gs_serve.py 原
#   SEG_GAP_SEC=0.30）。全篇实测停顿中位 GS 男 0.34s vs EL 0.18s（1.9×），
#   停顿次数 116 vs 403（少 71%）；z20 的 25s 片段里 GS 男声在 0.6~0.7s
#   出现 6 连尖峰 = 自然句末停顿 + 强制插入的叠加。
#   这正是 z20 员工盲听 GS 全 0 分、EL 满分而常规客观指标（click/音色/
#   杂音/CER）全面占优的矛盾来源——停顿结构不在任何常规指标里。
#
# GS_SEG_GAP=0：关掉强制插入，保留 GS 自己生成的句末停顿。
# 设回 0.30 即恢复改动前行为。
[Service]
Environment="GS_SEG_GAP=0"
